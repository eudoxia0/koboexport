[package]
name = "koboexport"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A tiny Rust app to export Kobo clippings."

[dependencies]
clap = { version = "4.5.49", features = ["derive"] }
rusqlite = "0.37.0"

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
